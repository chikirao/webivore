<!doctype html><html><head><title>Lazy gallery</title></head><body style="margin:0"><header style="position:fixed;background:rgb(255,0,0);width:100%;height:60px">One fixed header only</header><h1>Lazy gallery with delayed pictures below the first viewport</h1><p>This page has enough introductory text, but its useful image appears only after scrolling into the lower part of the page.</p><div style="height:1800px"></div><img id="lazy" loading="lazy" width="400" height="240" alt="Lazy green image"><div style="height:1000px"></div><script>const image=document.querySelector('#lazy');new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting))setTimeout(()=>image.src='/green.svg',450)}).observe(image)</script></body></html>
